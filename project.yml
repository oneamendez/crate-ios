name: Crate
options:
  bundleIdPrefix: com.amendez
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    # Pinned: 1.19.0 and later add a build-tool plugin xcodebuild can't stage
    # for an iOS destination, and main has moved to Swift 6 mode.
    exactVersion: 1.18.0

targets:
  Crate:
    type: application
    platform: iOS
    sources:
      - path: Sources/Crate
      - path: Resources
        excludes:
          - Info.plist
          - Crate.entitlements
      # Settings > Acknowledgements shows them.
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Crate
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - ar
          - zh-Hans
          - fr
        # The system's grouped background, as Home's, so launch doesn't flash
        # white before the first screen (HIG: Launching).
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Built-in StikJIT's pairing file lives in Documents/StikJIT, where
        # idevice_pair and Finder can put it as well as Settings' importer.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The JIT helper finds the iPhone's Remote Pairing service over Bonjour
        # when LocalDevVPN's usual address doesn't answer.
        NSLocalNetworkUsageDescription: crate looks for this iPhone's Remote Pairing service to turn on JIT.
        # Screenshots of a VM's screen go into Photos; crate adds, never reads.
        NSPhotoLibraryAddUsageDescription: crate saves screenshots of your VMs to Photos.
        # ...and pairs this iPhone with crate by advertising as a computer.
        NSBonjourServices:
          - _remotepairing._tcp
          - _remotepairing-pairable-host._tcp
        LSApplicationQueriesSchemes:
          - stikdebug
          - localdevvpn
        # LocalDevVPN comes back to crate:// once it has connected.
        CFBundleURLTypes:
          - CFBundleURLName: com.amendez.crate
            CFBundleURLSchemes:
              - crate
        # Picture in Picture, which floats the pairing code over Settings and
        # keeps crate running while the person types it there.
        UIBackgroundModes:
          - audio
    dependencies:
      - target: CrateJITHelper
      # idevice, built from source by Scripts/build-idevice.sh: pairing on the iPhone.
      - framework: Frameworks/IDevice.xcframework
        embed: false
      # crate, the VM engine, built by Scripts/build-crate.sh; `import CrateEngine`.
      - framework: Frameworks/Crate.xcframework
        embed: false
      # libslirp and GLib, crate's user-mode networking, built by
      # Scripts/build-slirp.sh: dynamic frameworks the app embeds.
      - framework: Frameworks/Slirp.xcframework
        embed: true
      - framework: Frameworks/GLib.xcframework
        embed: true
      - package: SwiftTerm
    # The VM's 3D: virglrenderer, libepoxy, ANGLE and MoltenVK, built by
    # Scripts/build-moltenvk.sh, build-angle.sh and build-virgl.sh. They're for
    # iPhones only and crate opens them itself, so they're copied in, not linked;
    # without them the VM still runs, in 2D.
    postBuildScripts:
      - name: Embed GPU frameworks
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = iphoneos ] || exit 0
          SRC="$PROJECT_DIR/Frameworks/GPU"
          NAMES="MoltenVK EGL GLESv2 epoxy virglrenderer.1"
          for name in $NAMES; do
            [ -d "$SRC/$name.framework" ] || {
              echo "warning: no $name.framework, so VMs get a 2D display: run Scripts/build-moltenvk.sh, build-angle.sh and build-virgl.sh"
              exit 0
            }
          done
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          for name in $NAMES; do
            rsync -a --delete "$SRC/$name.framework" "$DEST/"
            # Unsigned (the ipa workflow): Scripts/sign-ipa.sh signs them.
            [ -z "$EXPANDED_CODE_SIGN_IDENTITY" ] ||
              codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DEST/$name.framework"
          done
    entitlements:
      path: Resources/Crate.entitlements
      properties:
        # A VM's RAM lives inside this process, so Crate wants far more than the
        # default jetsam allowance. Settings > Memory reports what it got.
        com.apple.developer.kernel.increased-memory-limit: true
        com.apple.developer.kernel.extended-virtual-addressing: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amendez.crate
        DEVELOPMENT_TEAM: L29MY952CB
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The code region is claimed in C (a `brk` with arguments in x0 and x1).
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Crate/JIT/Crate-Bridging-Header.h
        # The GPU embed script reads Frameworks/GPU, outside the sandbox's inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        TARGETED_DEVICE_FAMILY: "1,2"

        # The Simulator does not verify signatures, so skip signing there. Scoped
        # to the simulator SDK: unscoped, it produces an app a device refuses.
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
        # idevice is built for Apple silicon Simulators only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
      configs:
        Debug:
          # CrateTests uses `@testable import Crate`.
          ENABLE_TESTABILITY: YES

  # Built-in StikJIT: the second process that attaches a debugger to crate (see
  # CrateJITHelper.swift). StikJIT has no Simulator slice, so it's linked and
  # embedded in device builds only, and the helper compiles without it there.
  CrateJITHelper:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/JITHelper
    info:
      path: Resources/JITHelper-Info.plist
      properties:
        CFBundleDisplayName: crate JIT helper
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          # Apple's AR viewer point, with a rule nothing matches: no app or
          # share sheet ever offers it, and crate starts it by bundle ID.
          NSExtensionPointIdentifier: com.apple.ar.viewer
          NSExtensionPrincipalClass: CrateJITHelper
          NSExtensionAttributes:
            NSExtensionActivationRule: FALSEPREDICATE
        # An app-type process per request, not a plain XPC service.
        XPCService:
          ServiceType: Application
          _MultipleInstances: true
          _ProcessType: App
    postBuildScripts:
      - name: Embed StikJIT
        basedOnDependencyAnalysis: false
        script: |
          [ "$PLATFORM_NAME" = iphoneos ] || exit 0
          SRC="$PROJECT_DIR/Frameworks/StikJIT.xcframework/ios-arm64/StikJIT.framework"
          [ -d "$SRC" ] || { echo "error: no StikJIT: run Scripts/fetch-stikjit.sh"; exit 1; }
          DEST="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          mkdir -p "$DEST"
          rsync -a --delete "$SRC" "$DEST/"
          # Unsigned (the ipa workflow): Scripts/sign-ipa.sh signs it.
          [ -z "$EXPANDED_CODE_SIGN_IDENTITY" ] ||
            codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$DEST/StikJIT.framework"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amendez.crate.jithelper
        DEVELOPMENT_TEAM: L29MY952CB
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY[sdk=iphoneos*]: Apple Development
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
        # The embed script reads Frameworks/, outside the sandbox's inputs.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: $(PROJECT_DIR)/Frameworks/StikJIT.xcframework/ios-arm64
        OTHER_LDFLAGS[sdk=iphoneos*]: -framework StikJIT
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

  # Aurora Edition's checks: localisation completeness and formatting. Hosted
  # in the app so it can read the app's own .lproj bundles.
  CrateTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CrateTests
    dependencies:
      - target: Crate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amendez.crate.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Crate.app/Crate"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: NO
        CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]: NO
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64

schemes:
  Crate:
    build:
      targets:
        Crate: all
        CrateTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CrateTests
    archive:
      config: Release
